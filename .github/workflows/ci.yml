name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Le PostgreSQL de la machine est utilisé pour que le serveur et les outils de
      # sauvegarde (pg_dump, pg_restore) soient de la même version, comme sur un site.
      - name: Démarrer PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE pharmaly LOGIN PASSWORD 'pharmaly' CREATEDB"
          sudo -u postgres psql -c "SELECT version()"
          pg_dump --version
      - run: dotnet test -c Release
        env:
          PHARMALY_TEST_POSTGRES: Host=localhost;Username=pharmaly;Password=pharmaly;Database=postgres

  windows:
    name: Tests, exécutables et essai de rapidité (Windows)
    runs-on: windows-latest
    env:
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Démarrer PostgreSQL
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE ROLE pharmaly LOGIN PASSWORD 'pharmaly' CREATEDB"
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE DATABASE pharmaly_ci OWNER pharmaly"
          & "$env:PGBIN\psql.exe" -U postgres -c "SELECT version()"

      - name: Tests
        run: dotnet test -c Release
        env:
          PHARMALY_TEST_POSTGRES: Host=localhost;Username=pharmaly;Password=pharmaly;Database=postgres

      - name: Produire les exécutables Windows
        shell: pwsh
        run: |
          dotnet publish src/Pharmaly.Server -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o publish/serveur
          dotnet publish src/Pharmaly.Poste -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish/poste
          Get-ChildItem publish -Recurse -File | Select-Object FullName, @{n="Mo";e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Essai de rapidité sur Windows
        shell: pwsh
        run: |
          $settings = '{ "ConnectionStrings": { "Pharmaly": "Host=localhost;Database=pharmaly_ci;Username=pharmaly;Password=pharmaly" } }'
          Set-Content -Path publish/serveur/appsettings.Local.json -Value $settings -Encoding utf8
          Push-Location publish/serveur
          & .\Pharmaly.Server.exe --donnees-fictives 20000
          if ($LASTEXITCODE -ne 0) { throw "Chargement des données fictives en échec" }
          & .\Pharmaly.Server.exe --initialiser-site D1 "Site d essai" MAGASIN
          $account = (& .\Pharmaly.Server.exe --creer-compte-caisse caisse1 "Caisse 1" D1 | Select-String "^SECRET=").ToString().Substring(7)
          $code = (& .\Pharmaly.Server.exe --creer-administrateur 1 "Responsable Essai" | Select-String "^SECRET=").ToString().Substring(7)
          if (-not $account -or -not $code) { throw "Mise en place du site en échec" }
          $env:PHARMALY_ESSAI_COMPTE = "caisse1"
          $env:PHARMALY_ESSAI_MOT_DE_PASSE = $account
          $env:PHARMALY_ESSAI_MATRICULE = "1"
          $env:PHARMALY_ESSAI_CODE = $code
          # Empreinte du certificat du serveur, lue comme le ferait l'installateur : l'essai
          # automatique n'accepte que ce serveur-là.
          $fingerprint = (& .\Pharmaly.Server.exe --empreinte | Select-String "^EMPREINTE=").ToString().Substring(10)
          if ($fingerprint -notmatch "^[0-9A-F]{64}$") { throw "Empreinte du certificat illisible" }
          $env:PHARMALY_ESSAI_EMPREINTE = $fingerprint
          $server = Start-Process -FilePath .\Pharmaly.Server.exe -PassThru -RedirectStandardOutput serveur.log -RedirectStandardError serveur-erreurs.log
          Pop-Location
          Start-Sleep -Seconds 5
          # Le certificat est auto-signé : ces appels de contrôle ne le vérifient pas ; le poste,
          # lui, exige l'empreinte lue ci-dessus.
          Invoke-RestMethod https://127.0.0.1:5443/sante -SkipCertificateCheck | ConvertTo-Json
          try { Invoke-RestMethod "https://127.0.0.1:5443/produits/recherche?q=creme" -SkipCertificateCheck; throw "Le serveur a répondu sans identification" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } else { "Sans identification : accès refusé (401), comme attendu" } }

          # Aucun échange en clair : ni sur le port chiffré, ni sur l'ancien port 5080.
          $clearAnswered = $false
          try { Invoke-RestMethod http://127.0.0.1:5443/sante -TimeoutSec 10 | Out-Null; $clearAnswered = $true } catch { "Appel HTTP clair sur le port 5443 : refusé, comme attendu ($($_.Exception.Message))" }
          if ($clearAnswered) { throw "Le serveur a répondu à un appel HTTP non chiffré" }
          $oldPort = New-Object System.Net.Sockets.TcpClient
          try { $oldPort.Connect("127.0.0.1", 5080); $clearAnswered = $true } catch { "Port 5080 fermé, comme attendu" } finally { $oldPort.Dispose() }
          if ($clearAnswered) { throw "Une écoute non chiffrée est ouverte sur le port 5080" }

          $report = Join-Path $PWD "publish\rapport-essai-windows.json"
          $poste = Start-Process -FilePath publish\poste\PharmalyGestion.exe -ArgumentList "--essai-auto", "--rapport", "`"$report`"" -PassThru
          if (-not $poste.WaitForExit(120000)) { $poste.Kill(); throw "Le logiciel du poste ne s'est pas terminé en 2 minutes" }

          $server.Refresh()
          "Mémoire du serveur après l'essai : {0:N0} Mo" -f ($server.WorkingSet64 / 1MB)
          Stop-Process -Id $server.Id -Force
          if (-not (Test-Path $report)) { throw "Aucun rapport produit : la fenêtre ne s'est pas ouverte" }
          Get-Content $report
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.ServerReachable) { throw "Le poste n'a pas joint le serveur" }

      - name: Un serveur dont l'empreinte n'est pas celle attendue est refusé
        shell: pwsh
        run: |
          # Même essai, mais avec une empreinte qui n'est pas celle du serveur : le poste doit
          # refuser de lui parler, donc ne pas le joindre.
          Push-Location publish/serveur
          $server = Start-Process -FilePath .\Pharmaly.Server.exe -PassThru -RedirectStandardOutput serveur2.log -RedirectStandardError serveur2-erreurs.log
          Pop-Location
          Start-Sleep -Seconds 5
          $env:PHARMALY_ESSAI_EMPREINTE = "00112233445566778899AABBCCDDEEFF00112233445566778899AABBCCDDEEFF"
          $report = Join-Path $PWD "publish\rapport-essai-refus.json"
          $poste = Start-Process -FilePath publish\poste\PharmalyGestion.exe -ArgumentList "--essai-auto", "--rapport", "`"$report`"" -PassThru
          if (-not $poste.WaitForExit(120000)) { $poste.Kill(); throw "Le logiciel du poste ne s'est pas terminé en 2 minutes" }
          Stop-Process -Id $server.Id -Force
          if (-not (Test-Path $report)) { throw "Aucun rapport produit" }
          $result = Get-Content $report | ConvertFrom-Json
          if ($result.ServerReachable) { throw "Le poste a accepté un serveur dont l'empreinte n'était pas celle attendue" }
          "Empreinte différente : le poste a refusé le serveur, comme attendu"

      - name: Préparer le dossier d'essai à télécharger
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/essai | Out-Null
          Copy-Item publish/serveur/Pharmaly.Server.exe, publish/serveur/appsettings.json publish/essai/
          Copy-Item publish/poste/PharmalyGestion.exe, publish/poste/poste.json publish/essai/
          Copy-Item essai/* publish/essai/
          New-Item -ItemType Directory -Force publish/essai-verification | Out-Null
          Copy-Item publish/essai/* publish/essai-verification/

      # L'installation d'essai est rejouée telle qu'un utilisateur la ferait, avec Windows
      # PowerShell 5.1 (celui de tous les PC), puis le poste se connecte avec les identifiants
      # écrits dans ACCES-ESSAI.txt.
      - name: L'installation d'essai fonctionne sur un Windows neuf
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File publish/essai-verification/installer-essai.ps1 -PostgresPassword root -PostgresBin "$env:PGBIN" -SansLancement
          if ($LASTEXITCODE -ne 0) { throw "L'installation d'essai a échoué" }
          $acces = Get-Content publish/essai-verification/ACCES-ESSAI.txt -Raw
          $acces
          $motDePasse = [regex]::Match($acces, 'Mot de passe : (\S+)').Groups[1].Value
          $code = [regex]::Match($acces, 'Code         : (\S+)').Groups[1].Value
          if (-not $motDePasse -or -not $code) { throw "Identifiants absents de ACCES-ESSAI.txt" }
          $stock = & "$env:PGBIN\psql.exe" -U postgres -d pharmaly_essai -tAc "SELECT count(*) FROM stock_levels WHERE quantity = 50"
          if ([int]$stock -lt 2000) { throw "Stock fictif absent ($stock produits)" }
          "Produits avec du stock : $stock"

          Push-Location publish/essai-verification
          $empreinte = (& .\Pharmaly.Server.exe --empreinte | Select-String "^EMPREINTE=").ToString().Substring(10)
          $server = Start-Process -FilePath .\Pharmaly.Server.exe -PassThru -RedirectStandardOutput serveur.log -RedirectStandardError serveur-erreurs.log
          Pop-Location
          Start-Sleep -Seconds 5
          $env:PHARMALY_ESSAI_COMPTE = "caisse1"
          $env:PHARMALY_ESSAI_MOT_DE_PASSE = $motDePasse
          $env:PHARMALY_ESSAI_MATRICULE = "1"
          $env:PHARMALY_ESSAI_CODE = $code
          $env:PHARMALY_ESSAI_EMPREINTE = $empreinte
          $report = Join-Path $PWD "publish\rapport-installation-essai.json"
          $poste = Start-Process -FilePath publish\essai-verification\PharmalyGestion.exe -ArgumentList "--essai-auto", "--rapport", "`"$report`"" -PassThru
          if (-not $poste.WaitForExit(120000)) { $poste.Kill(); throw "Le logiciel du poste ne s'est pas terminé en 2 minutes" }
          Stop-Process -Id $server.Id -Force
          Get-Content $report
          $result = Get-Content $report | ConvertFrom-Json
          if (-not $result.ServerReachable) { throw "Le poste installé par le script d'essai n'a pas joint son serveur" }

      - uses: actions/upload-artifact@v4
        with:
          name: pharmaly-gestion-windows
          path: |
            publish/serveur/Pharmaly.Server.exe
            publish/serveur/appsettings.json
            publish/poste/PharmalyGestion.exe
            publish/poste/poste.json
            publish/rapport-essai-windows.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pharmaly-essai-windows
          path: publish/essai/
          if-no-files-found: error
